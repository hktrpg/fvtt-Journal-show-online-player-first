name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.1)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Get version from module.json
      id: get-version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Validate version in module.json
      run: |
        MODULE_VERSION=$(node -p "require('./module.json').version")
        RELEASE_VERSION="${{ steps.get-version.outputs.version }}"
        
        if [ "$MODULE_VERSION" != "$RELEASE_VERSION" ]; then
          echo "Error: Version mismatch!"
          echo "module.json version: $MODULE_VERSION"
          echo "Release version: $RELEASE_VERSION"
          exit 1
        fi
        
        echo "Version validation passed: $MODULE_VERSION"
        
    - name: Create module.zip
      run: |
        # Create zip file with all necessary files
        zip -r module.zip . -x "*.git*" "*.github*" "node_modules/*" "*.zip"
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get-version.outputs.version }}
        name: Release v${{ steps.get-version.outputs.version }}
        body: |
          ## Foundry VTT Module Release v${{ steps.get-version.outputs.version }}
          
          ### Changes
          - Updated to version ${{ steps.get-version.outputs.version }}
          
          ### Installation
          1. Download the `module.zip` file
          2. Extract it to your Foundry VTT modules directory
          3. Enable the module in your world settings
          
          ### Files included
          - `module.json` - Module manifest
          - `index.js` - Main module code
          - `README.md` - Documentation
          - `LICENSE` - License file
        files: module.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
